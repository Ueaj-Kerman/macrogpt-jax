[project]
name = "nanollama"
version = "0.1.0"
description = "MacroGPT-JAX: configurable distributed pretraining on JAX/Flax"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jax[cuda12]>=0.8.1",
    "flax>=0.12.0",
    "optax>=0.2.6",
    "numpy>=2.3,<3",
    "datasets>=4.4.1",
    "transformers>=4.57.1",
    "huggingface-hub>=0.36.0",
    "safetensors>=0.7.0",
    "wandb>=0.23.0",
    "kvax @ https://ueaj.dev/python/kvax-0.1.2-py3-none-any.whl",
    "jax-triton @ git+https://github.com/jax-ml/jax-triton.git@48a0ff700ec539a3694982c7cacf8fd32595468b",
    # triton 3.7 emits PTX 9.1 (CUDA 13 toolchain); we're on cuda12, so pin <3.7.
    "triton>=3.6,<3.7",
]

[project.optional-dependencies]
modal = ["modal>=0.65"]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ueaj"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Allow the kvax URL wheel and the jax-triton git source.
# To re-pin or upgrade:  uv lock --upgrade
# To sync env:            uv sync
